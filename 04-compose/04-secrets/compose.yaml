services:
  web:
    build: ../02-depends-healthcheck/app
    ports:
      - "8083:8080"
    environment:
      - DB_HOST=db
      - DB_NAME=app
      - DB_USER=app
      # ไม่ใส่ password ใน environment — อ่านจาก secret file แทน
      - DB_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pg-data:
