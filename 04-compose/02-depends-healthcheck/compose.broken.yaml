services:
  web:
    build: ./app
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=db
      - DB_NAME=app
      - DB_USER=app
      - DB_PASSWORD=secret
    depends_on:
      - db              # รอแค่ container "started" ไม่ได้รอให้ postgres ready
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=secret
