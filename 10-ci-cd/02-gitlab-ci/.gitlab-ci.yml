# ⚠️ GitLab shared runners ใช้ DinD (Docker-in-Docker) ไม่ใช่ DooD
# เพราะ shared runner ต้องการ isolation ระหว่าง job ของลูกค้าคนละคน
# — ถ้า mount /var/run/docker.sock (DooD) job หนึ่งจะเห็น container ของ job อื่นได้
# self-hosted runner ที่รันบนเครื่องเดียวกันทั้งทีม → ใช้ DooD ได้ปลอดภัยกว่า

default:
  # Pin version — ห้าม latest ตามกฎ CLAUDE.md
  image: docker:27.3
  services:
    - docker:27.3-dind

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_REPO: $CI_REGISTRY_IMAGE
  IMAGE_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_REF: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - build
  - scan
  - push

# ── 1) Build แบบ amd64 อย่างเดียวก่อน เพื่อให้ Trivy scan ได้ก่อน push ─────────
build:
  stage: build
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name lab-builder
    - >
      docker buildx build
      --platform linux/amd64
      --tag "$IMAGE_SHA"
      --cache-from type=registry,ref=$IMAGE_REPO:buildcache
      --cache-to type=registry,ref=$IMAGE_REPO:buildcache,mode=max
      --push
      ./app

# ── 2) Security scan ด้วย Trivy (CLAUDE.md ข้อ 7) ────────────────────────────
scan:
  stage: scan
  image:
    name: aquasec/trivy:0.57.0
    entrypoint: [""]
  variables:
    # ให้ trivy login เข้า GitLab Registry ผ่าน env (มันไม่มี docker CLI)
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - >
      trivy image
      --severity CRITICAL,HIGH
      --ignore-unfixed
      --exit-code 1
      --no-progress
      "$IMAGE_SHA"

# ── 3) Build multi-arch + push (linux/amd64,linux/arm64) ─────────────────────
push-multiarch:
  stage: push
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # ติดตั้ง QEMU เพื่อ emulate arm64 บน amd64 runner
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5 --install all
    - docker buildx create --use --name lab-multiarch
    - >
      docker buildx build
      --platform linux/amd64,linux/arm64
      --tag "$IMAGE_SHA"
      --tag "$IMAGE_REF"
      --cache-from type=registry,ref=$IMAGE_REPO:buildcache
      --push
      ./app
  rules:
    # multi-arch ช้า ทำเฉพาะ default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
