# Stack file — Swarm-aware compose.yaml
# deploy ด้วย: docker stack deploy -c compose.yaml myapp
services:
  web:
    image: nginxdemos/hello:plain-text
    ports:
      - "9082:80"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
    networks:
      - frontend

  cache:
    image: redis:7-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    networks:
      - backend

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
